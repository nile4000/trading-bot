app = "nilslueem-trading-bot-demo"
primary_region = "fra"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  TRADING_PAPER_BOT_BOT_ID = "btcusdt-paper-demo-fly"
  TRADING_PAPER_EXECUTION_ORDER_MODE = "PLACE_ORDER"
  TRADING_PAPER_EXECUTION_PLACE_ORDERS_ENABLED = "true"
  TRADING_PAPER_EXECUTION_ORDER_QUANTITY = "0.0015"
  TRADING_PAPER_EXECUTION_MAX_ORDER_NOTIONAL = "200.0"
  TRADING_STRATEGY_FILTERS_ADX_ENABLED = "true"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
