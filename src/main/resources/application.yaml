trading:
  app:
    lifecycle-events: false
  reporting:
    pretty-print: true
    include-notes: true
  strategy:
    name: ema_cross
    parameters:
      short-ema: 3
      long-ema: 7
    filters:
      adx:
        enabled: true
        period: 14
        minimum-strength: 20
  backtest:
    csv-path: data/historical/BTCUSDT-1h.csv
    symbol: BTCUSDT
    timeframe: 1h
    order-quantity: 0.0001
    execution-fee-rate: 0.001
    slippage-rate: 0.0005
    portfolio:
      initial-cash: 10000.0
  paper:
    bot:
      bot-id: btcusdt-paper-demo
      bot-version: v1
      symbol: BTCUSDT
      timeframe: 1m
    execution:
      exchange: BINANCE_SPOT_DEMO
      order-mode: VALIDATE_ONLY
      tick-interval-millis: 10000
      bot-initial-cash: 10000.0
      order-quantity: 0.0015
      place-orders-enabled: false
      max-order-notional: 150.0
    binance:
      api-key: ${BINANCE_DEMO_API_KEY:}
      secret-key: ${BINANCE_DEMO_SECRET_KEY:}
      recv-window-millis: 15000
      base-url: https://demo-api.binance.com

"%paper":
  trading:
    app:
      lifecycle-events: true

"%backtest-1m":
  trading:
    backtest:
      csv-path: data/historical/BTCUSDT-1m.csv
      timeframe: 1m

"%backtest-5m":
  trading:
    backtest:
      csv-path: data/historical/BTCUSDT-5m.csv
      timeframe: 5m

"%backtest-15m":
  trading:
    backtest:
      csv-path: data/historical/BTCUSDT-15m.csv
      timeframe: 15m

"%backtest-1h":
  trading:
    backtest:
      csv-path: data/historical/BTCUSDT-1h.csv
      timeframe: 1h

"%backtest-1h-adx":
  trading:
    backtest:
      csv-path: data/historical/BTCUSDT-1h.csv
      timeframe: 1h
    strategy:
      filters:
        adx:
          enabled: true
